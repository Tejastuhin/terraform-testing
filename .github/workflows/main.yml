name: CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dockerfile-demo/full-project-docker

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t flask-app .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: docker tag flask-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull tejastuhin/flask-app:latest

            sudo docker stop flask-app || true
            sudo docker rm flask-app || true

            sudo docker stop postgres-db || true
            sudo docker rm postgres-db || true

            sudo docker network create flask-network || true

            sudo docker volume create postgres-data || true

            sudo docker run -d \
              --name postgres-db \
              --network flask-network \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=mypassword \
              -e POSTGRES_DB=postgres \
              -v postgres-data:/var/lib/postgresql \
              postgres

            sudo docker run -d \
              --name flask-app \
              --network flask-network \
              -p 80:8000 \
              -e DB_HOST=postgres-db \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=mypassword \
              -e POSTGRES_DB=postgres \
              tejastuhin/flask-app:latest
