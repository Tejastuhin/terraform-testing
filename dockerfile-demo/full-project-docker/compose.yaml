services:

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres

  database:
    image: postgres
    environment:
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: